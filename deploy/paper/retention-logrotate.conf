/var/lib/fastmm/retention/observe-*/features.log {
    size 64M
    rotate -1
    missingok
    notifempty
    compress
    delaycompress
    create 0640 fastmm fastmm
    sharedscripts
    postrotate
        systemctl kill --kill-who=main --signal=HUP fastmm-retention-observe.service || true
    endscript
}
